/**:
  ros__parameters:
    debug: true
    armor_solver.result_img.jpeg_quality: 50  # 结果图像的jpeg压缩质量，0-100，数值越大质量越好，文件也越大
    target_frame: odom
    gimble_frame: gimbal_link
    max_armor_distance: 10.0
    filter_reset_dt_thres: 1.0
    enable_solveYawPnp: true  #三分法求yaw

    ekf:
      lmtd_top_model:
        q_pos_v: 100.0
        q_orientation_yaw_v: 400.0

      armor_model:
        q_x: 0.01
        q_v: 110.0

        r_yaw: 1.0
        r_pitch: 1.5
        r_distance: 50.0

    tracker:
      max_match_distance: 0.5
      max_match_yaw_diff: 0.7

      tracking_thres: 2
      lost_time_thres: 0.3
          
    solver:
      use_armor_top: true            # 是否使用平移运动模型(armor_model),仅在 top0 时使用
      use_ballistic_compensation: true # 只切换发射 pitch；关闭时用几何角，飞行时间预测不变
      predict2send_delay: 0.11         # 从预测到串口发送的延迟
      controller_delay: 0.0           # 开火延迟
      additional_prediction_time: 0.00 # MPC目标时域额外前移s，只应用一次，不在输出端再叠加速度
      shooting_range_width: 0.135     # 开火宽度范围
      shooting_range_height: 0.135    # 开火高度范围
      compensator_type: "ceres" # ideal(仅重力) resistance(阻力近似) ceres(ceres线阻力) rk4(四阶龙格库塔)
      gravity: 9.8       #重力加速度
      resistance: 0.022928514188   #空气阻力
      iteration_times: 20 # 补偿的迭代次数 暂时没用到
      rk4:
        time_step: 0.003
        max_steps: 8000
        hit_distance_threshold: 0.02

      # MPC 约束是初始联调值，不是已经测定的电机能力；运行时修改后需重启节点。
      mpc:
        enabled: true
        mode: direct    # angle_command 角度规划；direct 直发对照
        command_weight: 0.05        # 偏离瞄准角的代价；越大越接近直发
        horizon: 20                 # 0.2 s 时域
        dt: 0.01                    # 模型步长 s
        position_weight: 1.0
        max_iterations: 3000
        tolerance: 0.00001
        feedback_timeout: 0.1       # 反馈采样年龄上限 s，重复快照不续期
        target_timeout: 0.3         # 图像目标年龄上限 s
        yaw:
          response_time: 0.06      # s，一阶闭环时间常数，试验初值，需实测辨识
          max_command_lead: 10.0    # degree，相对当前估计姿态的指令幅度上限
        pitch:
          response_time: 0.08      # s，试验初值，需实测辨识
          max_command_lead: 5.0     # degree，非电机实际速度/加速度保证

      # max_out_error 是开火误差，1最大，是整块小装甲板大小
      # max_orientation_angle 是击打装甲板最大角度
      # 以下的 angle 为角度制
      top0:
        max_out_error: 0.7
        max_orientation_angle: 58.88
      top1:
        activate_threshold: 90.0  # 角速度达到该值时提升到1级
        deactivate_threshold: 60.0 # 角速度低于该值时降到0级
        max_out_error: 0.7
        max_orientation_angle: 30.0
      top2:
        activate_threshold: 500.0 # 角速度达到该值时提升到2级
        deactivate_threshold: 450.0 # 角速度低于该值时降到1级
        max_out_error: 1.8
        max_orientation_angle: 0.0
      # ["距离下限, 距离上限, 高度下限, 高度上限, pitch轴补偿值，yaw轴补偿值"]
      # 目标相对于odom
      angle_offset: [
        "0.0 6.0 -1.0 1.0 2.3 1.2",
                         

      ]
