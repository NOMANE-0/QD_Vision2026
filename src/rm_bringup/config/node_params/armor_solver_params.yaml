/**:
  ros__parameters:
    debug: true  # 绘制检测框（EKF 关闭）或跟踪投影框（EKF 开启）
    enable_ekf: true  # 开启 EKF 跟踪预测与云台指令；false 时仅查看图像/PnP，修改后重启
    # 结果图是彩色图，仅发布原图与普通压缩图，停用深度图压缩插件。
    armor_solver.result_img.enable_pub_plugins: ["image_transport/raw", "image_transport/compressed"]
    armor_solver.result_img.jpeg_quality: 50  # 结果图像的jpeg压缩质量，0-100，数值越大质量越好，文件也越大
    target_frame: odom
    gimble_frame: gimbal_link
    max_armor_distance: 10.0
    filter_reset_dt_thres: 1.0
    enable_solveYawPnp: true  #三分法求yaw

    ekf:
      lmtd_top_model:
        q_pos_v: 100.0
        q_orientation_yaw_v: 400.0

      armor_model:
        q_x: 0.01
        q_v: 1.0  # 降低静止装甲板观测抖动引出的虚假横向速度；实测回放验证

        r_yaw: 1.0
        r_pitch: 1.5
        r_distance: 50.0

    tracker:
      max_match_distance: 0.5
      max_match_yaw_diff: 0.7

      tracking_thres: 2
      lost_time_thres: 0.3
          
    solver:
      top_activation_frames: 4        # 连续 4 张新图像同向超过阈值才切换旋转瞄准模式
      yaw_filter_alpha: 0.25          # 每张新图像更新 25%；目标首次出现时直接使用原始角度
      yaw_filter_deadband_deg: 0.15   # 原始 yaw 与滤波值相差不超过此角度时保持指令
      yaw_filter_fire_tolerance_deg: 0.5 # 滤波尚未追上原始角度时暂停开火
      use_armor_top: true             # 普通跟随使用装甲板位置 EKF；陀螺仍使用整车模型
      enable_motion_prediction: true  # false：保留 EKF 和弹道补偿，跳过所有运动外推；支持在线切换
      predict2send_delay: 0.0         # 从预测到串口发送的延迟
      controller_delay: 0.0           # 开火延迟
      additional_prediction_time: 0.0 # 根据角速度，给电控指令的额外预测时间
      shooting_range_width: 0.135     # 开火宽度范围
      shooting_range_height: 0.135    # 开火高度范围
      bullet_speed: 16.0   # 未收到有效电控反馈时的兜底弹速，单位 m/s
      bullet_speed_filter_alpha: 0.3  # 弹速一阶低通滤波系数，越小越稳
      compensator_type: "ceres" # ideal(仅重力) resistance(阻力近似) ceres(ceres线阻力) rk4(四阶龙格库塔)
      gravity: 9.8       #重力加速度
      resistance: 0.022928514188   #空气阻力
      iteration_times: 20 # 补偿的迭代次数 暂时没用到
      rk4:
        time_step: 0.003
        max_steps: 8000
        hit_distance_threshold: 0.02

      # max_out_error 是开火误差，1最大，是整块小装甲板大小
      # max_orientation_angle 是击打装甲板最大角度
      # 以下的 angle 为角度制
      top0:
        max_out_error: 0.7
        max_orientation_angle: 58.88
      top1:
        activate_threshold: 90.0  # 角速度达到该值时提升到1级
        deactivate_threshold: 60.0 # 角速度低于该值时降到0级
        max_out_error: 0.7
        max_orientation_angle: 30.0
      top2:
        activate_threshold: 500.0 # 角速度达到该值时提升到2级
        deactivate_threshold: 450.0 # 角速度低于该值时降到1级
        max_out_error: 1.8
        max_orientation_angle: 0.0
      # ["距离下限, 距离上限, 高度下限, 高度上限, pitch轴补偿值，yaw轴补偿值"]
      # 目标相对于odom
      angle_offset: [
        "0.0 6.0 -1.0 1.0 1.5 0.0",

      ]
